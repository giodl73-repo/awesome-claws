schemaVersion: 1
agent:
  tools:
    profile: full
    allow:
      - read
      - write
      - edit
      - apply_patch
      - exec
      - process
      - diffs
      - github__get_file_contents
      - github__search_code
    fs:
      workspaceOnly: true
extensions:
  - id: diffs
    kind: plugin
    format: openclaw
    source: clawhub
    ref: "@openclaw/diffs"
    version: 2026.7.1
