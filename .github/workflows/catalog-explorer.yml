name: Catalog Explorer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-explorer.yml"
      - "catalog-explorer.html"
      - "catalog-chooser.json"
      - "catalog.json"
      - "experience-cases.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Stage generated explorer
        run: |
          mkdir -p .pages
          cp catalog-explorer.html .pages/index.html
          cp CHOOSER.md catalog-chooser.json catalog.json experience-cases.json .pages/
          touch .pages/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .pages
      - name: Deploy catalog explorer
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
